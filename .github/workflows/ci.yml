name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar que no haya docs personales (solo PRs a main)
        if: github.base_ref == 'main'
        run: |
          if git ls-files | grep -E '(^|/)CLAUDE[^/]*\.md$'; then
            echo "::error::Estos archivos no pueden llegar a main. Crea una rama release/* desde dev y bórralos con git rm."
            exit 1
          fi

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Para comentar la cobertura en el PR
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pytest con cobertura
        # coverage.xml lo usa el job de SonarQube
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: coverage.xml
          retention-days: 7

      - name: Resumen de cobertura
        run: |
          {
            echo "<!-- cobertura-backend -->"
            echo "### Cobertura de tests (backend): $(coverage report --format=total)%"
            echo
            echo "<details><summary>Detalle por archivo</summary>"
            echo
            coverage report --format=markdown
            echo
            echo "</details>"
          } > cobertura.md
          cat cobertura.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comentar cobertura en el PR
        if: github.event_name == 'pull_request'
        # Si no se puede comentar (ej. PR desde un fork), el CI no falla por eso
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const body = require("fs").readFileSync("cobertura.md", "utf8");
            const marker = "<!-- cobertura-backend -->";
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            // Se actualiza el mismo comentario en cada push, en vez de agregar uno nuevo
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const previous = comments.find((c) => c.body.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  dependencies:
    name: Dependencias (Trivy)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # requirements.txt usa rangos (fastapi>=0.110) y Trivy solo reconoce versiones exactas:
      # se instalan las dependencias y se analiza la lista con las versiones que quedaron
      - name: Resolver versiones exactas
        run: |
          pip install -r requirements.txt
          mkdir -p trivy-scan
          pip freeze > trivy-scan/requirements.txt

      # Falla si hay vulnerabilidades altas o críticas que ya tienen versión corregida
      - name: Analizar dependencias con Trivy
        # Fijado a un commit (v0.36.0): un tag se puede mover, un commit no
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: trivy-scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          output: trivy.txt

      - name: Resumen de Trivy
        if: always()
        run: |
          {
            echo "### Análisis de dependencias (Trivy): vulnerabilidades altas y críticas"
            echo
            echo '```'
            cat trivy.txt 2>/dev/null || echo "Trivy no generó reporte (revisa el paso anterior)."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  sonarqube:
    name: Calidad (SonarQube)
    needs: test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # SonarQube necesita el historial completo para saber qué código es nuevo
          fetch-depth: 0

      - name: Traer reporte de cobertura
        uses: actions/download-artifact@v4
        with:
          name: cobertura-backend

      - name: Avisar si falta SONAR_TOKEN
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::Falta el secret SONAR_TOKEN; se omite el análisis de SonarQube."

      # Analiza con SonarQube Cloud (sonar-project.properties) y espera el quality gate:
      # el job falla si el código no lo cumple
      - name: Analizar con SonarQube
        if: env.SONAR_TOKEN != ''
        # Fijado a un commit (v8.4.0): un tag se puede mover, un commit no
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304
        with:
          args: >
            -Dsonar.qualitygate.wait=true
