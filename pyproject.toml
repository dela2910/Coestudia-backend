[tool.ruff]
line-length = 100
target-version = "py312"
# Las migraciones las genera Alembic
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Cobertura: pytest --cov=app (el CI la publica en cada PR)
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
